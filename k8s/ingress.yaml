apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: okane
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - okane.no
        - www.okane.no
      secretName: okane-tls
  rules:
    - host: okane.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
    - host: www.okane.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
